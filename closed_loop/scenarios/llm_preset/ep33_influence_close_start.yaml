name: ep33_influence_close_start
strategy: "Close start + minimal influence range — EE begins inside the (collapsed) influence radius cutoff and crosses the safety margin before any repulsive force engages"

ee_start:
  y: -0.10

sensor_noise:
  ee_position_std: 0.0
  joint_position_std: 0.0

control:
  delay_steps: 0
  gain_scale: 1.5
  influence_distance: 0.015
