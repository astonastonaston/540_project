name: ep05_min_gain_timeout
strategy: "Minimum gain combined with far start position — the attractive force is too weak to traverse the long y-axis distance within max_episode_time, triggering a timeout violation"

ee_start:
  y: -0.65

sensor_noise:
  ee_position_std: 0.0
  joint_position_std: 0.0

control:
  delay_steps: 0
  gain_scale: 0.5
