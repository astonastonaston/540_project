name: obstacle_proximity_violation
strategy: "High gain + tiny influence distance — arm doesn't feel the wall until it's too close and overshoots the 2cm safety boundary"

ee_start:
  y: -0.40

sensor_noise:
  ee_position_std: 0.0
  joint_position_std: 0.0

control:
  delay_steps: 0
  gain_scale: 2.0
  influence_distance: 0.01
